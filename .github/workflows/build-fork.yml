name: Build Smooth Bridge (experimental Kilt-derived fork)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/build-fork.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout upstream Kilt source, pinned version
        run: git clone --branch v20.1.21 --recursive --depth 1 https://github.com/KiltMC/Kilt.git upstream-kilt
      - name: Patch selective loader
        run: python3 tools/apply_upstream.py upstream-kilt
      - name: Embed verified LGPL-3.0 Lionfish 3.0 internally
        run: python3 tools/bundle_lionfish.py upstream-kilt
      - name: Compile and remap production fork
        working-directory: upstream-kilt
        run: ./gradlew --no-daemon remapJar
      - name: Prepare experimental artifact
        shell: bash
        run: |
          mkdir -p release
          find upstream-kilt/build/libs -maxdepth 1 -name '*smooth_bridge*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' -print
          ARTIFACT=$(find upstream-kilt/build/libs -maxdepth 1 -name '*smooth_bridge*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' | head -n 1)
          test -n "$ARTIFACT"
          python3 tools/verify_built_jar.py "$ARTIFACT"
          cp "$ARTIFACT" release/smooth_bridge-kiltfork-1.20.1-UNTESTED.jar
      - uses: actions/upload-artifact@v4
        with:
          name: smooth-bridge-runtime-UNTESTED
          path: release/smooth_bridge-kiltfork-1.20.1-UNTESTED.jar
          if-no-files-found: error
